<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentOS — Set a new password</title>

    <link rel="stylesheet" href="set-password.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <main class="set-password-page">

        <!-- Top Right Support -->
        <div class="support">
            Need help?
            <a href="#">Contact support</a>
        </div>


        <!-- Main Content -->
        <section class="set-password-card">

            <!-- Back to Sign In -->
            <a href="index.html" class="back-link">
                <span>←</span> Back to sign in
            </a>


            <!-- Password Icon -->
            <div class="password-icon">

                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

                    <rect
                        x="5"
                        y="10"
                        width="14"
                        height="10"
                        rx="2"
                        stroke="currentColor"
                        stroke-width="1.6"
                    />

                    <path
                        d="M8 10V7.5C8 5.57 9.57 4 11.5 4H12.5C14.43 4 16 5.57 16 7.5V10"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linecap="round"
                    />

                    <circle
                        cx="12"
                        cy="15"
                        r="1"
                        fill="currentColor"
                    />

                </svg>

            </div>


            <!-- Heading -->
            <h1>Set a new password</h1>


            <!-- Description -->
            <p class="description">
                Choose a strong password you haven't used on
                <br> StudentOS before.
            </p>


            <!-- Form -->
            <form class="password-form" id="passwordForm">

                <!-- New Password -->
                <div class="form-group">

                    <label for="newPassword">
                        New password
                    </label>

                    <div class="password-input-wrapper">

                        <input type="password" id="newPassword" class="password-input" placeholder="Create a password" autocomplete="new-password">

                        <button type="button" class="password-toggle" id="toggleNewPassword" aria-label="Show password">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                            >

                                <path
                                    d="M2.5 12C4.5 8 7.5 6 12 6C16.5 6 19.5 8 21.5 12C19.5 16 16.5 18 12 18C7.5 18 4.5 16 2.5 12Z"
                                    stroke="currentColor"
                                    stroke-width="1.5"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5"
                                    stroke="currentColor"
                                    stroke-width="1.5"
                                />

                            </svg>

                        </button>

                    </div>


                    <!-- Strength -->
                    <div class="strength-bars">

                        <span class="strength-bar active"></span>
                        <span class="strength-bar active"></span>
                        <span class="strength-bar active"></span>
                        <span class="strength-bar active"></span>

                    </div>

                    <div class="strength-text">
                        Strong password
                    </div>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm new password
                    </label>

                    <div class="password-input-wrapper">

                        <input type="password" id="confirmPassword" class="password-input" placeholder="Re-enter your password" autocomplete="new-password">

                        <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Show password">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                            >

                                <path
                                    d="M2.5 12C4.5 8 7.5 6 12 6C16.5 6 19.5 8 21.5 12C19.5 16 16.5 18 12 18C7.5 18 4.5 16 2.5 12Z"
                                    stroke="currentColor"
                                    stroke-width="1.5"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5"
                                    stroke="currentColor"
                                    stroke-width="1.5"
                                />

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- Update Password -->
                <button type="submit" class="update-button">
                    Update password
                </button>

            </form>


            <!-- Bottom Back Link -->
            <a href="index.html" class="bottom-back">
                ← Back to sign in
            </a>

        </section>


        <!-- Terms -->
        <p class="terms">
            By continuing you agree to the StudentOS Terms of Service and Privacy Policy.
        </p>

    </main>


    <script src="set-password.js"></script>

</body>

</html>
