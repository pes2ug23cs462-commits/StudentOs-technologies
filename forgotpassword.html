<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f1e">

    <title>Forgot Password | StudentOS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="forgot-password.js" defer></script>
</head>

<body class="forgot-page">

    <main class="forgot-app">

        <div class="forgot-support">
            Need help?
            <a href="mailto:support@studentos.example">Contact support</a>
        </div>

        <section class="forgot-card">

            <a href="index.html" class="forgot-back">
                <span aria-hidden="true">←</span> Back to sign in
            </a>

            <div class="forgot-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
          <circle cx="15.5" cy="8.5" r="4.5"></circle>
          <path d="m12.3 11.7-8.8 8.8v-4h3v-3h3l2.8-2.8"></path>
        </svg>
            </div>

            <header class="forgot-heading">
                <h1>Forgot your password?</h1>

                <p>
                    Enter the email linked to your StudentOS account<br class="desktop-break"> and we'll send you a secure link to reset it.
                </p>
            </header>

            <form id="forgotForm" novalidate>

                <div class="forgot-field">
                    <label for="forgotEmail">Email</label>

                    <input type="email" id="forgotEmail" name="email" placeholder="you@school.edu" autocomplete="email" required>

                    <small class="forgot-error" id="forgotEmailError"></small>
                </div>

                <p class="forgot-message" id="forgotMessage" role="status" aria-live="polite"></p>

                <button type="submit" class="forgot-submit">
          Send reset link
        </button>

            </form>

            <p class="forgot-signin">
                Remembered it?
                <a href="index.html">Sign in</a>
            </p>

        </section>

        <footer class="forgot-legal">
            By continuing, you agree to the StudentOS
            <a href="index.html#terms">Terms of Service</a> and
            <a href="index.html#privacy">Privacy Policy</a>.
        </footer>

    </main>

</body>

</html>
